name: ABUTRON Native Writer Source Readonly Inspect
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  inspect:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON NATIVE WRITER SOURCE INSPECT V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Read bounded root-owned native writer source with sensitive-line redaction
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import ast,hashlib,re,subprocess
          def source(label,path,ranges):
              p=Path(path)
              if not p.is_file() or p.is_symlink() or p.stat().st_size>75000:
                  print("SOURCE_NOT_VERIFIED",label);return
              lines=p.read_text().splitlines()
              print("SOURCE_FILE",label,"sha256",hashlib.sha256(p.read_bytes()).hexdigest(),"total_lines",len(lines))
              for a,b in ranges:
                  print("RANGE",label,a,b)
                  for n in range(a,min(b,len(lines))+1):
                      line=lines[n-1]
                      if re.search(r"password|passwd|private_key|api[_ ]token|authorization|credential|auth\.ini|api[_ ]secret",line,re.I):
                          print(f"{n}: [SECRET-RELATED LINE REDACTED]")
                      else:print(f"{n}: {line[:185]}")
          source("order_writer","/opt/apex-client-mt5/apex_native_order_runtime.py",[(405,468),(470,560),(563,610)])
          source("router","/opt/apex-client-mt5/apex_signal_native_router_v1.py",[(1,110)])
          for fn in ["/opt/apex-client-mt5/apex_signal_native_router_v1.py","/opt/apex-client-mt5/customer_order_ledger.py","/opt/apex-client-mt5/native_apex_feed.py"]:
              p=Path(fn)
              try:
                  tree=ast.parse(p.read_text())
                  print("SYMBOLS",p.name,[(x.name,x.lineno) for x in tree.body if isinstance(x,(ast.FunctionDef,ast.ClassDef))][:70])
              except Exception as exc:print("SYMBOLS_UNVERIFIED",p.name,type(exc).__name__)
          print("SOURCE_AUDIT_NO_CHANGES")
          PY

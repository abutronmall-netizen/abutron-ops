name: ABUTRON 6207 Startup Audit One Shot
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  audit:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON 6207 STARTUP AUDIT V2'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Inspect only fixed service status and sanitized read-only sidecar state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/python3 - <<'PY'
          import json,os,re,stat,subprocess,time
          from pathlib import Path
          def show(unit,*props):
              p=subprocess.run(["systemctl","show",unit,"--no-pager",*sum((["-p",x] for x in props),[])],
                capture_output=True,text=True,timeout=8,check=False)
              for line in p.stdout.splitlines():
                  if "=" in line:
                      k,v=line.split("=",1)
                      if k not in ("ExecStart","Environment","EnvironmentFiles"):
                          print("SYSTEMD",unit,k,v[:160])
          unit="abutron-native-readonly-mt5-6207.service"
          print("DIAG_V2_UTC",time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()))
          show(unit,"ActiveState","SubState","Result","MainPID","ExecMainStartTimestamp","ExecMainExitTimestamp","MemoryCurrent","NRestarts")
          show("abutron-apex-native-orders.timer","ActiveState","UnitFileState")
          base=Path("/var/lib/private/abutron-native-readonly-mt5-6207")
          h=base/"worker-health.json"
          if h.is_file() and not h.is_symlink() and h.stat().st_size<10000:
              d=json.loads(h.read_text())
              for k in ("status","broker_status","broker_session_identity_verified","native_history_source_authenticated",
                        "cycles","errors","native_tick_rows","native_deal_export_count"):
                  v=d.get(k)
                  if (type(v) in (int,bool)) or (type(v)==str and re.fullmatch("[A-Z0-9_]{2,100}",v)):
                      print("HEALTH",k,v)
              print("HEALTH_AGE_S",int(time.time()-h.stat().st_mtime))
              nonce=d.get("nonce")
              if type(nonce)==str and re.fullmatch("[a-f0-9]{32}",nonce):
                  p=base/"terminal/MQL5/Files"/("ABUTRON_SIDECAR_STATUS_V1_"+nonce+".txt")
                  if p.is_file() and not p.is_symlink() and p.stat().st_size<2048:
                      lines=p.read_text(encoding="utf-8-sig").splitlines()
                      print("MARKER_VALID_FORMAT",len(lines)==12)
                      print("MARKER_AGE_S",int(time.time()-p.stat().st_mtime))
                  else:print("MARKER_MISSING_FOR_NONCE")
              else:print("NONCE_NOT_YET_ESTABLISHED")
          pid=subprocess.run(["systemctl","show",unit,"--value","-p","MainPID"],capture_output=True,text=True).stdout.strip()
          if pid.isdigit() and int(pid)>0:
              cg=Path("/proc")/pid/"cgroup"
              if cg.is_file():
                  data=cg.read_text()
                  paths=[ln.split("::",1)[1] for ln in data.splitlines() if ln.startswith("0::")]
                  if len(paths)==1:
                      p=Path("/sys/fs/cgroup")/paths[0].lstrip("/")/"cgroup.procs"
                      if p.is_file():
                          nums=[int(v) for v in p.read_text().splitlines() if v.isdigit()]
                          print("SIDECAR_CGROUP_PIDS",len(nums))
                          from collections import Counter
                          counts=Counter()
                          for num in nums:
                              try:
                                  comm=(Path("/proc")/str(num)/"comm").read_text().strip()
                                  if re.fullmatch("[A-Za-z0-9._-]{1,50}",comm):
                                      counts[comm]+=1
                              except OSError:pass
                          for comm,n in counts.most_common(15):print("PROCESS_KIND",comm,n)
          src=Path("/opt/abutron-research/native-evidence/read-only-sidecar/abutron_deriv_readonly_sidecar_worker_v1.py")
          if src.is_file() and src.stat().st_size<20000:
              lines=src.read_text().splitlines()
              for i in range(105,min(178,len(lines))+1):
                  line=lines[i-1]
                  if re.search("passw|token|secret|cred|login|account|nonce|owner|key|auth.ini",line,re.I):continue
                  print("SOURCE",i,line[:160])
          print("DIAG_READONLY_END")
          PY

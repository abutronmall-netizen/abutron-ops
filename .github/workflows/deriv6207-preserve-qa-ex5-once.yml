name: ABUTRON 6207 Preserve Verified QA EX5 (one-shot)
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: none
  issues: read
jobs:
  preserve:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON 6207 PRESERVE QA EX5 V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Download private QA-only build artifact, never production EA
        uses: actions/download-artifact@v4
        with:
          name: abutron6207-v4-unapproved-qa-binary
          run-id: 42455355502
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/abutron6207-v4-qa-evidence
      - name: Verify SHA, zero-warning log and store outside MT5 tree under runner-only 0700 folder
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(id -un)" == "abutrongha" ]] || { echo "RUNNER_ACCOUNT_NOT_VERIFIED"; exit 10; }
          root="$RUNNER_TEMP/abutron6207-v4-qa-evidence"
          ex5="$root/AbutronApexExistingDerivV4_6207.ex5"
          log="$root/AbutronApexExistingDerivV4_6207.log"
          expected=5092b1b395ff91539f4d9952f89bc6976211ff43d4c7794caf7a76526a1d2ec9
          [[ -f "$ex5" && ! -L "$ex5" && -f "$log" && ! -L "$log" ]] || exit 11
          [[ "$(sha256sum "$ex5" | cut -d' ' -f1)" == "$expected" ]] || exit 12
          [[ "$(stat -c %s "$ex5")" == "54342" ]] || exit 13
          python3 - "$log" <<'PY'
          from pathlib import Path
          import sys
          raw=Path(sys.argv[1]).read_bytes()
          if len(raw)>1000000:raise SystemExit("UNTRUSTED_LOG_SIZE")
          try:
              text=raw.decode('utf-16' if raw.startswith((b'\xff\xfe',b'\xfe\xff')) else 'utf-8-sig')
          except UnicodeDecodeError:
              text=raw.decode('cp1252')
          if 'Result: 0 errors, 0 warnings' not in text:
              raise SystemExit("COMPILE_RESULT_NOT_CLEAN")
          print("ZERO_ERROR_ZERO_WARNING_NATIVE_COMPILE_LOG_VERIFIED")
          PY
          safe="$HOME/abutron-unapproved-qa-evidence"
          if [[ -L "$safe" || ( -e "$safe" && ! -d "$safe" ) ]]; then exit 14; fi
          install -d -m 0700 "$safe"
          if [[ "$(stat -c %a "$safe")" != 700 ]]; then exit 15; fi
          dest="$safe/deriv6207-v4-20261108"
          if [[ -L "$dest" || ( -e "$dest" && ! -d "$dest" ) ]]; then exit 16; fi
          install -d -m 0700 "$dest"
          target="$dest/AbutronApexExistingDerivV4_6207.ex5.UNAPPROVED"
          if [[ -e "$target" ]]; then
            [[ ! -L "$target" && "$(sha256sum "$target" | cut -d' ' -f1)" == "$expected" ]] || exit 17
          else
            install -m 0600 "$ex5" "$target"
          fi
          install -m 0600 "$log" "$dest/MetaEditor_ZeroError_ZeroWarning_QA.log"
          printf '%s\n' \
            'QA_ONLY_NOT_APPROVED_FOR_PRODUCTION' \
            'Original V4RevisionAuthorized is hard-false pending CRM lease guardian' \
            'Source Git blob 319c68d825b235ffaaa1eb2b7bdf5b82d35aa838' \
            'Include SHA256 e2e4e01ef5e96f888f687a45e21de83cfc78b419787a0c3667d96914d1cc3c44' \
            'EX5 SHA256 5092b1b395ff91539f4d9952f89bc6976211ff43d4c7794caf7a76526a1d2ec9' \
            'DO_NOT_COPY_TO_RUNNING_MT5_OR_ENABLE_TRADING' \
            > "$dest/README_QA_ONLY.txt"
          chmod 0600 "$dest/README_QA_ONLY.txt"
          [[ "$(sha256sum "$target" | cut -d' ' -f1)" == "$expected" ]] || exit 18
          echo "QA_EX5_PRESERVED_READ_ONLY_NON_MT5_LOCATION"
          echo "QA_EVIDENCE_FOLDER=$dest"
          echo "QA_EX5_SHA256=$expected"
          echo "NO_MT5_SERVICE_OR_ACCOUNT_FLAGS_CHANGED"

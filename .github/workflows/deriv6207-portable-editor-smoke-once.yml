name: ABUTRON 6207 Isolated Portable MetaEditor Smoke
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  compile:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON PORTABLE METAEDITOR SMOKE V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 5
    steps:
      - name: Copy only root-verified 64bit editor and terminal executable to fresh nonroot QA directory, no production usage
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=c7b82be1a4329817591c1ce315f97b94976fe90e7280fb643948876ac5e87e5b
          base=/opt/abutron/client-mt5-template-v2
          editor="$base/MetaEditor64.exe"
          terminal="$base/terminal64.exe"
          [[ -f "$editor" && ! -L "$editor" && -f "$terminal" && ! -L "$terminal" ]] || exit 20
          [[ "$(sha256sum "$editor" | cut -d' ' -f1)" == "$expected" ]] || exit 21
          for path in "$editor" "$terminal"; do
            read -r uid mode < <(stat -c '%u %a' "$path")
            [[ "$uid" == 0 && $((8#$mode & 022)) -eq 0 ]] || exit 22
          done
          qa="$(mktemp -d "$RUNNER_TEMP/abutron-portable-metaeditor.XXXXXXXX")"
          chmod 0700 "$qa"
          mkdir -m 0700 "$qa/app" "$qa/prefix"
          export WINEPREFIX="$qa/prefix"
          export WINEARCH=win64
          export WINEDEBUG=-all
          export WEBVIEW2_USER_DATA_FOLDER="C:\\ABUTRON_QA_NO_PRODUCTION"
          trap 'timeout 8s wineserver -k >/dev/null 2>&1 || true; if [[ -n "$qa" && "$qa" == "$RUNNER_TEMP"/abutron-portable-metaeditor.* ]]; then rm -rf -- "$qa"; fi' EXIT
          cp -- "$editor" "$qa/app/MetaEditor64.exe"
          cp -- "$terminal" "$qa/app/terminal64.exe"
          chmod 0700 "$qa/app/MetaEditor64.exe" "$qa/app/terminal64.exe"
          printf '%s\r\n' '#property strict' '#property version "1.00"' 'void OnStart() { Print("ABUTRON_QA_NO_ORDERS"); }' > "$qa/compile_smoke.mq5"
          chmod 0600 "$qa/compile_smoke.mq5"
          timeout --kill-after=5s 65s xvfb-run -a wineboot -u >"$qa/wineboot.log" 2>&1 || exit 23
          winfile="$(winepath -w "$qa/compile_smoke.mq5")"
          cd "$qa/app"
          rc=0
          timeout --kill-after=5s 75s xvfb-run -a wine ./MetaEditor64.exe \
            "/compile:$winfile" /log /portable >"$qa/metaeditor.log" 2>&1 || rc=$?
          echo "PORTABLE_QA_COMPILER_EXIT=$rc"
          if [[ -f "$qa/compile_smoke.log" ]]; then
            echo "COMPILER_LOG_PRESENT=true"
            echo "COMPILER_LOG_SIZE=$(stat -c %s "$qa/compile_smoke.log")"
            grep -Ei 'errors?,|warnings?,|compiled|failed' "$qa/compile_smoke.log" | head -n 8 || true
          else
            echo "COMPILER_LOG_PRESENT=false"
          fi
          if [[ -s "$qa/compile_smoke.ex5" ]]; then
            echo "QA_EX5_SHA256=$(sha256sum "$qa/compile_smoke.ex5" | cut -d' ' -f1)"
            echo "QA_EX5_BYTES=$(stat -c %s "$qa/compile_smoke.ex5")"
          else
            echo "QA_EX5_MISSING"
          fi
          echo "NO_MT5_SESSION_OR_BROKER_ACTIONS"
          [[ "$rc" == 0 && -s "$qa/compile_smoke.ex5" ]] || exit 24
          echo "PORTABLE_METAEDITOR_QA_COMPILER_PASS"

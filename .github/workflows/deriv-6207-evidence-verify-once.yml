name: ABUTRON 6207 Broker Evidence Recovery Verify (one-shot)
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  verify:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON 6207 EVIDENCE VERIFY V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Read-only native broker evidence freshness, no credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/python3 - <<'PY'
          import json,re,stat,time,subprocess,hashlib
          from pathlib import Path
          p=Path('/var/lib/private/abutron-native-readonly-mt5-6207/worker-health.json')
          now=time.time()
          if not p.is_file(): raise SystemExit('HEALTH_MISSING')
          doc=json.loads(p.read_text())
          nonce=doc.get('nonce')
          if type(nonce)!=str or re.fullmatch('[0-9a-f]{32}',nonce) is None:
              raise SystemExit('NONCE_NOT_VALIDATED')
          age=round(now-p.stat().st_mtime)
          print('sidecar_health_status',doc.get('status') if re.fullmatch('[A-Z0-9_]{3,75}',str(doc.get('status'))) else 'REDACTED')
          print('health_age_s',age)
          print('authenticated_broker_session',doc.get('broker_session_identity_verified') is True)
          print('native_history_authenticated',doc.get('native_history_source_authenticated') is True)
          m=Path('/var/lib/private/abutron-native-readonly-mt5-6207/terminal/MQL5/Files')/('ABUTRON_SIDECAR_STATUS_V1_'+nonce+'.txt')
          if not m.is_file() or m.is_symlink() or m.stat().st_size>4096:
              print('native_marker_missing_or_invalid')
          else:
              lines=m.read_text(encoding='utf-8-sig').splitlines()
              print('marker_age_s',round(now-m.stat().st_mtime))
              print('marker_schema_valid',len(lines)==12 and lines[0]=='ABUTRON_SIDECAR_STATUS_V1' and lines[1]==nonce and lines[3]=='Deriv-Demo' and lines[4]=='DEMO' and lines[-1]=='NO_ORDER_FUNCTIONS')
              if len(lines)==12:
                  try:
                      print('native_broker_epoch_age_s',round(now-int(lines[5])))
                      print('native_cycles',int(lines[6]),'tick_rows',int(lines[7]),'deal_exports',int(lines[8]),'errors',int(lines[10]))
                  except ValueError:
                      print('native_metadata_invalid')
          for unit in ['abutron-native-readonly-mt5-6207.service','abutron-apex-native-orders.timer']:
              p=subprocess.run(['systemctl','show',unit,'--value','-p','ActiveState'],capture_output=True,text=True,timeout=6)
              print('unit',unit,'active_state',p.stdout.strip())
          print('VERIFIED_READONLY_CHECK_COMPLETE')
          PY

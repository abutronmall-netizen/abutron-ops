name: ABUTRON 6207 Native Source Readonly Handoff
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  source_review:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON V4 READ VERIFIED EA SOURCE V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Inspect exact copied MQ5 source as non-root, refuse likely embedded secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,stat
          p=Path('/var/lib/abutron-apex11-source-handoff/adaptive_bridge.mq5')
          st=p.lstat()
          if not stat.S_ISREG(st.st_mode) or p.is_symlink() or st.st_size>160000:
              raise SystemExit('SOURCE_HANDOFF_INVALID')
          raw=p.read_bytes()
          expected='dfc436a42d5210e93f51652e1ac95c65820a3b906cf2629808f9c93850998bc3'
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit('SOURCE_SHA256_MISMATCH')
          source=raw.decode('utf-8-sig')
          sensitive=re.compile(r'-----BEGIN (?:OPENSSH |RSA |EC |DSA )?PRIVATE KEY|(?:password|passwd|api[_-]?key|api[_-]?secret|bearer[_ -]?token|access[_-]?token)\s*[=:]\s*["\x27][^"\x27]{4,}',re.I)
          if sensitive.search(source):
              raise SystemExit('POTENTIAL_EMBEDDED_SECRETS_REFUSE_TO_DISPLAY')
          print('SOURCE_HEADER_SHA256',expected)
          print('SOURCE_BYTE_COUNT',len(raw))
          print('SOURCE_LINE_COUNT',len(source.splitlines()))
          for i in range(0,len(source),950):
              print('SOURCE_VERIFIED_CHUNK',i//950,json.dumps(source[i:i+950],ensure_ascii=True))
          print('SOURCE_CHUNKS_COMPLETE',(len(source)+949)//950)
          PY

name: ABUTRON Native Lock Interface Probe
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  probe:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON NATIVE LOCK PROBE V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 2
    steps:
      - name: Read only approved native writer constants without sudo
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('/opt/apex-client-mt5/apex_native_order_runtime.py')
          if not p.is_file() or p.is_symlink() or p.stat().st_size>60000:
              print('NATIVE_WRITER_SOURCE_NOT_READABLE')
          else:
              s=p.read_text()
              for i,line in enumerate(s.splitlines(),1):
                  if re.match(r'^(ROOT|REQUEST_NAME|RECEIPT_DIR|LOCK|RECEIPT_NAME|DB|TRADE_SYMBOLS)\s*=',line):
                      print('NATIVE_INTERFACE_LINE',i,line[:180])
              print('NATIVE_INTERFACE_PROBE_COMPLETE')
          PY

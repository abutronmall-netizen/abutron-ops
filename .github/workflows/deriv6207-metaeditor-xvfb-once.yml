name: ABUTRON 6207 MetaEditor Xvfb Dialog Audit
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  audit:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON 6207 METAEDITOR XVFB DIALOG CHECK V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 3
    steps:
      - name: Inspect isolated harmless Wine compiler window titles for hidden startup dialog
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v xdotool >/dev/null
          qa="$(mktemp -d "$RUNNER_TEMP/abutron-metaeditor-dialog.XXXXXXX")"
          chmod 0700 "$qa"
          export QA_DIR="$qa"
          cat >"$qa/smoke.mq5" <<'SRC'
          #property strict
          void OnStart() { Print("COMPILER_ONLY_NO_BROKER"); }
          SRC
          timeout --kill-after=5s 80s xvfb-run -a bash -s <<'SH'
          set -Eeuo pipefail
          export WINEPREFIX="$QA_DIR/wineprefix"
          export WINEDEBUG=-all
          mkdir -m 0700 "$WINEPREFIX"
          timeout --kill-after=5s 35s wineboot -u >"$QA_DIR/wineboot.log" 2>&1 || {
            echo "ISOLATED_WINEBOOT_FAILED"
            exit 22
          }
          windows_source="$(winepath -w "$QA_DIR/smoke.mq5")"
          editor=/opt/abutron/client-mt5-template-v2/MetaEditor64.exe
          timeout --kill-after=3s 30s wine "$editor" "/compile:$windows_source" /log \
            >"$QA_DIR/compile.log" 2>&1 &
          pid=$!
          sleep 12
          echo "ISOLATED_VISIBLE_WINDOW_TITLES"
          ids="$(xdotool search --onlyvisible --name '.' 2>/dev/null || true)"
          echo "VISIBLE_WINDOW_COUNT=$(printf '%s\n' "$ids" | grep -Ec '^[0-9]+$' || true)"
          counter=0
          for id in $ids; do
            counter=$((counter+1))
            if ((counter > 15)); then break; fi
            title="$(xdotool getwindowname "$id" 2>/dev/null || true)"
            if [[ -n "$title" ]]; then
              printf 'WINDOW_TITLE=%s\n' "$(printf '%s' "$title" | head -c 120)"
            fi
          done
          wait "$pid" || true
          if [[ -f "$QA_DIR/smoke.log" ]]; then
            echo COMPILER_LOG_EXISTS
          else
            echo COMPILER_LOG_MISSING
          fi
          timeout 8s wineserver -k >/dev/null 2>&1 || true
          SH
          echo "DIALOG_AUDIT_DONE_NO_PRODUCTION_ACTIONS"

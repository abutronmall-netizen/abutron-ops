name: ABUTRON Private MCP Tunnel Service Stage V1

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: abutron-private-mcp-service-stage
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'abutronmall-netizen' &&
      github.triggering_actor == 'abutronmall-netizen' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON OPS STAGE PRIVATE MCP SERVICE V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Stage non-root outbound tunnel daemon without starting
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -un)" = 'abutrongha'
          test "$(id -u)" -ne 0
          test "$(git branch --show-current)" = main
          test "$(git status --porcelain)" = ''
          bash -n ops/mcp_gateway/stage-tunnel-service-v1.sh
          sudo -n /usr/bin/bash ops/mcp_gateway/stage-tunnel-service-v1.sh stage
          echo 'PRIVATE_MCP_SERVICE_STANDBY_NOT_RUNNING'

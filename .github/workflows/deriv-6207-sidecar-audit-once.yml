name: ABUTRON Deriv 6207 Sidecar Marker Audit (one-shot)
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
concurrency:
  group: abutron-one-shot-6207-diagnosis
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON 6207 SIDECAR DIAGNOSIS V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Inspect only sanitized isolated MT5 sidecar marker evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/python3 - <<'PY'
          import hashlib, json, os, re, stat, time
          from pathlib import Path
          if os.geteuid()!=0:raise SystemExit("ROOT_REQUIRED")
          root=Path("/var/lib/private/abutron-native-readonly-mt5-6207")
          p=root/"worker-health.json"
          now=time.time()
          print("DERIV_6207_READONLY_SIDECAR_DIAGNOSIS")
          if not p.is_file():raise SystemExit("SIDECAR_HEALTH_MISSING")
          doc=json.loads(p.read_text())
          nonce=doc.get("nonce")
          status=doc.get("status")
          print("health_status",status if type(status)==str and re.fullmatch("[A-Z_]{3,80}",status) else "UNKNOWN")
          print("health_age_sec",int(now-p.stat().st_mtime))
          print("trusted_native_proof",doc.get("broker_session_identity_verified") is True)
          print("native_ticks_reported",doc.get("native_tick_rows") if type(doc.get("native_tick_rows")) is int else "UNKNOWN")
          if type(nonce)!=str or re.fullmatch("[a-f0-9]{32}",nonce) is None:
              raise SystemExit("SIDECAR_NONCE_UNVERIFIED")
          
          folder=root/"terminal/MQL5/Files"
          marker=folder/("ABUTRON_SIDECAR_STATUS_V1_"+nonce+".txt")
          print("native_status_file_exists",marker.exists())
          if marker.is_file() and not marker.is_symlink():
              st=marker.lstat()
              print("native_status_file_age_s",int(now-st.st_mtime),"file_size",st.st_size)
              if st.st_size<=4096:
                  lines=marker.read_text(encoding="utf-8-sig").splitlines()
                  print("native_marker_line_count",len(lines))
                  print("native_marker_type_matches",len(lines)>0 and lines[0]=="ABUTRON_SIDECAR_STATUS_V1")
                  print("nonce_matches",len(lines)>1 and lines[1]==nonce)
                  print("broker_server_matches",len(lines)>3 and lines[3]=="Deriv-Demo")
                  print("demo_marker_matches",len(lines)>4 and lines[4]=="DEMO")
                  print("no_order_functions_tag",len(lines)==12 and lines[-1]=="NO_ORDER_FUNCTIONS")
                  if len(lines)==12:
                      try:
                          epoch,cycles,ticks,deals,errors=(int(lines[i]) for i in (5,6,7,8,10))
                          print("native_broker_marker_age_sec",int(now-epoch))
                          print("native_cycles",cycles,"tick_count",ticks,
                                "deal_count",deals,"error_count",errors)
                      except ValueError:
                          print("native_marker_numbers_invalid")
          else:
              print("native_status_file_missing_or_unsafe")
          
          for label,subdir in [
              ("terminal_experts",root/"terminal/MQL5/Experts/ABUTRON"),
              ("terminal_indicators",root/"terminal/MQL5/Indicators/ABUTRON"),
          ]:
              if subdir.is_dir() and not subdir.is_symlink():
                  compiled=[p for p in subdir.iterdir() if p.suffix.lower()==".ex5" and p.is_file()]
                  print(label,"compiled_count",len(compiled))
              else:
                  print(label,"missing")
          print("READONLY_DIAGNOSIS_DONE_NO_SERVICE_RESTART")
          PY

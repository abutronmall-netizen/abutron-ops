name: ABUTRON Stage Nested Files Audit One Shot
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  audit:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON APEX11 NESTED STAGE V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Inspect staged archive manifests and file SHA without running code
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from hashlib import sha256
          import time,zipfile
          base=Path('/opt/abutron-apex11-staging')
          print('STAGE_NESTED_AUDIT_UTC',time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()))
          for p in sorted(base.iterdir(),key=lambda x:x.name):
              if p.is_dir():
                  fs=list(p.rglob('*'))
                  print('TREE',p.name,'total_entries',len(fs))
                  for entry in sorted(x for x in fs if x.is_file() and not x.is_symlink())[:35]:
                      rp=entry.relative_to(p)
                      if len(str(rp))<140:print('FILE',p.name,str(rp),entry.stat().st_size)
                  for x in ('apex11/abutron_replacement/bridge.py','abutron_replacement/bridge.py','apex/engine.py','risk_guard/abutron_risk_guard.py','SOURCE_IMPORT_AUDIT.json','requirements.txt'):
                      target=p/x
                      if target.is_file() and target.stat().st_size<100000:
                          print('CRITICAL_SHA256',p.name,x,sha256(target.read_bytes()).hexdigest())
              elif p.suffix=='.zip' and p.stat().st_size<100000000:
                  with zipfile.ZipFile(p) as z:
                      names=z.namelist()
                      print('ZIP',p.name,'files',len(names),'sample',names[:18])
          print('AUDIT_FINISHED_READONLY')
          PY

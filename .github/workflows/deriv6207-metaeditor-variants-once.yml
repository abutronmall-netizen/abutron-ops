name: ABUTRON MetaEditor Build Variant Audit
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  audit:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON METAEDITOR BUILD VARIANTS V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 3
    steps:
      - name: Read-only hash/size comparison of installed MetaEditor templates and Wine runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib,shutil,os,subprocess
          for path in [
            "/opt/abutron/client-mt5-template-v2/MetaEditor64.exe",
            "/opt/abutron/client-mt5-template-v3/MetaEditor64.exe",
            "/opt/abutron/client-mt5-template-v3-usd-50-100-canary-20261103/MetaEditor64.exe",
          ]:
              p=Path(path)
              try:
                  if not p.is_file() or p.is_symlink() or p.stat().st_size>200000000:
                      raise ValueError("METAEDITOR_UNVERIFIED")
                  s=p.stat()
                  print("EDITOR",path,"sha256",hashlib.sha256(p.read_bytes()).hexdigest(),
                        "bytes",s.st_size,"rootowned",s.st_uid==0,
                        "readonly_other",not bool(s.st_mode&0o022))
              except Exception as e: print("EDITOR_UNVERIFIED",path,type(e).__name__)
          for cmd in ["docker","podman","bwrap","exiftool","wrestool","strings","xwininfo","xdotool","wmctrl"]:
              print("OPTIONAL_TOOL",cmd, bool(shutil.which(cmd)))
          print("READONLY_AUDIT_NO_CHANGES")
          PY

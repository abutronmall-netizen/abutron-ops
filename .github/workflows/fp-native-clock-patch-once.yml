name: ABUTRON FP History UTC Source Patch (one-shot)
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
concurrency:
  group: abutron-one-shot-fp-utc-patch
  cancel-in-progress: false
jobs:
  patch:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON FP UTC SOURCE PATCH V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 5
    steps:
      - name: Atomic, backup-gated, hash-pinned FP collector UTC comparison only
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/python3 - <<'PY'
          import ast, hashlib, os, shutil, sqlite3, stat, tempfile, time
          from pathlib import Path
          
          if os.geteuid() != 0:
              raise SystemExit("ROOT_REQUIRED")
          source=Path("/opt/apex-client-mt5/fpmarkets-history/fp_native_history_collect.py")
          old_hash="2b367fc10287ec33ee41e3df08b202c80fa8e518ee0136a8c5556d36f59c24ad"
          old=b"end<=now+1_000_000 and end>=now-86400,"
          new=b"end-offset<=now+1_000_000 and end-offset>=now-86400,"
          
          # A recent owner-directed offsite backup must have *completed* with both
          # repository and database-readback evidence; log contents never enter Actions.
          logs=sorted(Path("/var/log").glob("abutron-gh-one-shot-backup-20261108-*.log"),
                      key=lambda x:x.stat().st_mtime,reverse=True)
          if not logs or time.time()-logs[0].stat().st_mtime>3600:
              raise SystemExit("FRESH_OFFSITE_BACKUP_LOG_UNVERIFIED")
          log=logs[0]
          if not stat.S_ISREG(log.lstat().st_mode) or log.stat().st_mode&0o077:
              raise SystemExit("OFFSITE_BACKUP_LOG_UNSAFE_PERMISSIONS")
          result=log.read_text(errors="replace")
          for evidence in ("FULL_BACKUP_END_SUCCESS","RESTIC_REPO_METADATA_CHECK_PASS",
                           "V7_DATABASE_REMOTE_DUMP_READBACK_PASS"):
              if evidence not in result:
                  raise SystemExit("OFFSITE_BACKUP_MISSING_"+evidence)
          print("PRECHANGE_OFFSITE_BACKUP_AND_DB_READBACK_CONFIRMED")
          
          if os.system("/usr/bin/systemctl is-active --quiet abutron-apex-native-orders.timer")==0:
              raise SystemExit("APEX_DISPATCH_TIMER_ACTIVE_REFUSE_PATCH")
          db=sqlite3.connect("file:/var/lib/apex-signup/accounts.sqlite3?mode=ro",
                            uri=True,timeout=5)
          db.execute("PRAGMA query_only=ON")
          rows=db.execute("""SELECT a.broker,a.environment,COALESCE(t.effective_enabled,0)
              FROM apex_mt5_connections a LEFT JOIN apex_trade_controls t
              ON t.connection_id=a.id WHERE a.broker IN ('Deriv','FP Markets')""").fetchall()
          db.close()
          if any(v != 0 for broker,env,v in rows if env=="LIVE" or broker=="FP Markets"):
              raise SystemExit("BROKER_EFFECTIVE_TRADING_UNSAFE_FOR_PATCH")
          print("FP_AND_LIVE_EFFECTIVE_SWITCHES_OFF_CONFIRMED")
          
          st=source.lstat()
          if not stat.S_ISREG(st.st_mode) or source.is_symlink() or st.st_size>50000:
              raise SystemExit("UNEXPECTED_NATIVE_COLLECTOR_FILE")
          original=source.read_bytes()
          fingerprint=hashlib.sha256(original).hexdigest()
          if fingerprint != old_hash:
              raise SystemExit("NATIVE_COLLECTOR_HASH_MISMATCH_REFUSE")
          if original.count(old) != 1:
              raise SystemExit("NATIVE_COLLECTOR_PATCH_TARGET_NOT_UNIQUE")
          patched=original.replace(old,new,1)
          ast.parse(patched.decode("utf-8"),filename=str(source))
          print("NATIVE_COLLECTOR_PATCH_SYNTAX_VERIFIED")
          
          stamp=time.strftime("%Y%m%dT%H%M%SZ",time.gmtime())
          backup_dir=Path("/var/backups")/("abutron-fp-native-history-clock-prechange-"+stamp)
          backup_dir.mkdir(mode=0o700)
          backup_file=backup_dir/source.name
          shutil.copy2(source,backup_file,follow_symlinks=False)
          os.chown(backup_file,st.st_uid,st.st_gid)
          if hashlib.sha256(backup_file.read_bytes()).hexdigest()!=old_hash:
              raise SystemExit("PRECHANGE_LOCAL_ROLLBACK_HASH_INVALID")
          
          fd,temp=tempfile.mkstemp(prefix=".abutron-fp-clock-",dir=source.parent)
          try:
              os.fchmod(fd,stat.S_IMODE(st.st_mode))
              os.fchown(fd,st.st_uid,st.st_gid)
              with os.fdopen(fd,"wb") as h:
                  h.write(patched)
                  h.flush()
                  os.fsync(h.fileno())
              if hashlib.sha256(Path(temp).read_bytes()).digest()!=hashlib.sha256(patched).digest():
                  raise SystemExit("TEMP_NATIVE_COLLECTOR_VERIFICATION_FAILED")
              os.replace(temp,source)
              dfd=os.open(str(source.parent),os.O_RDONLY|os.O_DIRECTORY)
              try:os.fsync(dfd)
              finally:os.close(dfd)
          finally:
              if os.path.exists(temp):os.unlink(temp)
          
          if source.read_bytes()!=patched:
              raise SystemExit("NATIVE_COLLECTOR_POSTWRITE_MISMATCH_RESTORE_FROM_LOCAL_BACKUP")
          print("FP_HISTORY_UTC_COMPARISON_PATCH_APPLIED")
          print("new_collector_sha256",hashlib.sha256(patched).hexdigest())
          print("rollback_file",str(backup_file))
          print("NO_SERVICE_RESTART_NO_ACCOUNTS_CHANGED_NO_BROKER_ORDERS")
          PY

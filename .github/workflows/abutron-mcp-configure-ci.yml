name: ABUTRON MCP Tunnel Operator Configure Offline Checks

on:
  pull_request:
    paths:
      - 'ops/mcp_gateway/configure-private-tunnel-v1.sh'
      - '.github/workflows/abutron-mcp-configure-ci.yml'
      - 'ops/mcp_gateway/OPERATE_PRIVATE_TUNNEL_V1.md'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and no secret storage in GitHub
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/mcp_gateway/configure-private-tunnel-v1.sh
          bash -n "$f"
          grep -Fq 'ROOT_INTERACTIVE_UBUNTU_TERMINAL_REQUIRED' "$f"
          grep -Fq 'read -rs API_KEY' "$f"
          grep -Fq 'runuser -u abutronmcp' "$f"
          grep -Fq 'doctor --profile abutron-production --explain' "$f"
          grep -Fq 'systemctl enable --now "$UNIT"' "$f"
          grep -Fq 'chown root:root "$TMP"' "$f"
          grep -Fq 'chmod 0600 "$TMP"' "$f"
          grep -Fq 'TUNNEL_DOCTOR_FAILED_NOT_ACTIVATED' "$f"
          ! grep -Eq 'curl.*[|].*(bash|sh)|sudoers|User=root|0[.]0[.]0[.]0' "$f"
          echo 'PRIVATE_MCP_TUNNEL_INTERACTIVE_CONFIG_STATIC_PASS'

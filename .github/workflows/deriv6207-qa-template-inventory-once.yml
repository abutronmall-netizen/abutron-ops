name: ABUTRON 6207 QA MetaEditor Template Inventory
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  inspect:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON QA MT5 TEMPLATE INVENTORY V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 3
    steps:
      - name: Inspect only sanitized template metadata; no MT5 execution
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,stat,collections
          base=Path('/opt/abutron/client-mt5-template-v2')
          assert base.is_dir() and not base.is_symlink()
          print('TEMPLATE_ROOT_OWNED',base.stat().st_uid==0)
          print('TEMPLATE_MODE',oct(stat.S_IMODE(base.stat().st_mode)))
          total=0; count=0; types=collections.Counter(); hidden=0; unsafe=0
          for directory,dirs,files in os.walk(base,followlinks=False):
              dirs[:]=[d for d in dirs if not (Path(directory)/d).is_symlink()]
              for name in files:
                  p=Path(directory)/name
                  try:
                      st=p.lstat()
                      if not stat.S_ISREG(st.st_mode):unsafe+=1;continue
                      count+=1;total+=st.st_size;types[p.suffix.lower()]+=1
                      if name.startswith('.'):hidden+=1
                  except OSError:unsafe+=1
          print('TOTAL_FILES',count,'TOTAL_BYTES',total,'NONREGULAR_FILES',unsafe,'HIDDEN_NAMES',hidden)
          for suffix in ['.exe','.dll','.mqh','.mq5','.ini','.dat','.srv','.hcc']:
              print('EXTENSION_COUNT',suffix,types[suffix])
          for relative in ['terminal64.exe','MetaEditor64.exe','MQL5/Include/Trade/Trade.mqh','config','MQL5/Files','bases','profiles','history','logs','webinstall']:
              p=base/relative
              print('EXPECTED',relative,'present',p.exists(),'is_dir',p.is_dir(), 'readable',os.access(p,os.R_OK))
          print('ONLY_TEMPLATE_METADATA_NO_ORDER_ACTIONS')
          PY

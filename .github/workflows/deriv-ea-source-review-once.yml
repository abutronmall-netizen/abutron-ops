name: ABUTRON Deriv Existing EA Source Transfer One Shot
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  transfer:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON DERIV V4 SOURCE REVIEW V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 4
    steps:
      - name: Read allowlisted original MQ5 for private source review without executing it
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib,json,re,stat
          from pathlib import Path
          p=Path('/var/backups/abutron-five-volatility-prechange-20261107T105218Z/adaptive_bridge.mq5')
          st=p.lstat()
          if not stat.S_ISREG(st.st_mode) or p.is_symlink() or st.st_size>160000:
              raise SystemExit('SOURCE_PATH_UNSAFE')
          blob=p.read_bytes()
          sha=hashlib.sha256(blob).hexdigest()
          if sha!='dfc436a42d5210e93f51652e1ac95c65820a3b906cf2629808f9c93850998bc3':
              raise SystemExit('SOURCE_SHA256_NOT_MATCHED')
          s=blob.decode('utf-8-sig')
          # Refuse export of likely credentials/key material, even to private GitHub.
          if re.search(r'-----BEGIN (?:OPENSSH |RSA |EC |DSA )?PRIVATE KEY|(?:password|passwd|api[_-]?key|api[_-]?secret|bearer[_ -]?token|access[_-]?token)\s*[=:]\s*["\x27][^"\x27]{4,}',s,re.I):
              raise SystemExit('POTENTIAL_SECRET_REQUIRES_OWNER_REDACTION')
          print('ABUTRON_SOURCE_SHA256',sha)
          print('ABUTRON_SOURCE_BYTE_COUNT',len(blob))
          print('ABUTRON_SOURCE_LINE_COUNT',len(s.splitlines()))
          for i in range(0,len(s),950):
              print('ABUTRON_SOURCE_CHUNK',i//950,json.dumps(s[i:i+950],ensure_ascii=True))
          print('ABUTRON_SOURCE_CHUNKS_COMPLETE',(len(s)+949)//950)
          PY

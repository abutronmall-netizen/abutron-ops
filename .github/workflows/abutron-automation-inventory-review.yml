name: ABUTRON Automation Inventory Privacy Contract
on:
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/abutron-automation-inventory-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate sanitized inventory, no production connectivity
        run: python3 -B automation/tools/verify_inventory.py

name: ABUTRON 6207 MetaEditor Isolated Compiler Smoke
on:
  issues:
    types: [opened]
permissions:
  contents: none
  issues: read
jobs:
  smoke:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON 6207 METAEDITOR ISOLATED SMOKE V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 5
    steps:
      - name: Compile harmless standalone MQL5 script in fresh non-root Wine QA prefix
        shell: bash
        run: |
          set -Eeuo pipefail
          for command in wine winepath wineboot xvfb-run wineserver; do
            command -v "$command" >/dev/null || exit 20
          done
          editor=/opt/abutron/client-mt5-template-v2/MetaEditor64.exe
          [[ -f "$editor" && ! -L "$editor" ]] || exit 21
          read -r uid mode < <(stat -c '%u %a' "$editor")
          [[ "$uid" == 0 && $((8#$mode & 022)) -eq 0 ]] || exit 22
          qa="$(mktemp -d "$RUNNER_TEMP/abutron-metaeditor-smoke.XXXXXXXX")"
          chmod 0700 "$qa"
          trap 'timeout 8s wineserver -k >/dev/null 2>&1 || true' EXIT
          mkdir -m 0700 "$qa/wineprefix"
          export WINEPREFIX="$qa/wineprefix"
          export WINEDEBUG=-all
          printf '%s\r\n' '#property strict' '#property version "1.00"' 'void OnStart() { Print("QA_ONLY_NO_TRADING"); }' >"$qa/AbutronCompileOnlySmoke.mq5"
          chmod 0600 "$qa/AbutronCompileOnlySmoke.mq5"
          echo "ISOLATED_WINE_PREFIX_INITIALIZING"
          timeout --kill-after=5s 70s xvfb-run -a wineboot -u >"$qa/wineboot.log" 2>&1 || {
            echo "ISOLATED_WINEBOOT_FAILED"; exit 23;
          }
          win_src="$(winepath -w "$qa/AbutronCompileOnlySmoke.mq5")"
          rc=0
          timeout --kill-after=5s 110s xvfb-run -a wine "$editor" \
            "/compile:$win_src" /log >"$qa/metaeditor_stdout.log" 2>&1 || rc=$?
          echo "METAEDITOR_EXIT=$rc"
          if [[ -f "$qa/AbutronCompileOnlySmoke.log" ]]; then
            echo "COMPILER_LOG_PRESENT"
            echo "COMPILER_LOG_BYTES=$(stat -c %s "$qa/AbutronCompileOnlySmoke.log")"
          else
            echo "COMPILER_LOG_MISSING"
          fi
          if [[ -s "$qa/AbutronCompileOnlySmoke.ex5" ]]; then
            echo "ISOLATED_COMPILE_EX5_SHA256=$(sha256sum "$qa/AbutronCompileOnlySmoke.ex5" | cut -d' ' -f1)"
            echo "ISOLATED_COMPILE_EX5_BYTES=$(stat -c %s "$qa/AbutronCompileOnlySmoke.ex5")"
          else
            echo "ISOLATED_COMPILE_EX5_MISSING"
          fi
          [[ "$rc" -eq 0 && -s "$qa/AbutronCompileOnlySmoke.ex5" ]] || exit 24
          echo "ISOLATED_METAEDITOR_TOOLCHAIN_PASS_NO_PRODUCTION_EA_TOUCHED"

name: ABUTRON 6207 Native V4 Isolated Compiler QA (one-shot)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: abutron-deriv6207-v4-qa-compile
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'abutronmall-netizen/abutron-ops' &&
      github.event.issue.user.login == 'abutronmall-netizen' &&
      github.event.issue.title == 'ABUTRON DERIV6207 V4 ISOLATED COMPILER QA V1'
    runs-on: [self-hosted, linux, x64, abutron-diagnostics]
    timeout-minutes: 7
    steps:
      - name: Checkout only source pinned to private Ops QA snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact original include and compile in a fresh unprivileged Wine prefix
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_include=e2e4e01ef5e96f888f687a45e21de83cfc78b419787a0c3667d96914d1cc3c44
          expected_source_blob=b2ba33416105e5719b740d164be8cd45561b80f9
          header=/var/lib/abutron-apex11-source-handoff/AdaptiveRiskProofV2.mqh
          src="$GITHUB_WORKSPACE/v4-qa-input/AbutronApexExistingDerivV4_6207.mq5"
          editor=/opt/abutron/client-mt5-template-v2/MetaEditor64.exe
          template=/opt/abutron/client-mt5-template-v2
          for tool in wine winepath xvfb-run sha256sum git; do
            command -v "$tool" >/dev/null || { echo "QA_TOOL_MISSING:$tool"; exit 20; }
          done
          [[ -f "$header" && ! -L "$header" ]] || { echo HEADER_NOT_HANDED_OFF; exit 21; }
          [[ "$(sha256sum "$header" | cut -d' ' -f1)" == "$expected_include" ]] || {
            echo HEADER_HASH_MISMATCH; exit 22;
          }
          [[ -f "$src" && ! -L "$src" ]] || { echo EA_SOURCE_MISSING; exit 23; }
          [[ "$(git hash-object "$src")" == "$expected_source_blob" ]] || {
            echo EA_SOURCE_GIT_BLOB_MISMATCH; exit 24;
          }
          [[ -f "$editor" && ! -L "$editor" ]] || { echo METAEDITOR_NOT_FOUND; exit 25; }
          read -r uid mode < <(stat -c '%u %a' "$editor")
          [[ "$uid" == "0" && $((8#$mode & 022)) -eq 0 ]] || {
            echo METAEDITOR_BINARY_NOT_ROOT_CONTROLLED; exit 26;
          }
          qa="$(mktemp -d "$RUNNER_TEMP/abutron6207-v4-qa.XXXXXXXX")"
          chmod 0700 "$qa"
          mkdir -m 0700 "$qa/MQL5" "$qa/MQL5/Experts" "$qa/MQL5/Experts/ABUTRON" "$qa/wineprefix"
          export WINEPREFIX="$qa/wineprefix"
          export WINEDEBUG=-all
          cp -- "$src" "$qa/MQL5/Experts/ABUTRON/AbutronApexExistingDerivV4_6207.mq5"
          cp -- "$header" "$qa/MQL5/Experts/ABUTRON/AdaptiveRiskProofV2.mqh"
          chmod 0600 "$qa/MQL5/Experts/ABUTRON/"*.mq5 "$qa/MQL5/Experts/ABUTRON/"*.mqh
          if grep -Eiq 'PRIVATE KEY|password[[:space:]]*=[[:space:]]*"[^"]{4,}"|api[_-]?secret[[:space:]]*=' "$qa/MQL5/Experts/ABUTRON/AdaptiveRiskProofV2.mqh"; then
            echo HEADER_POTENTIAL_SECRET_MANUAL_REVIEW_REQUIRED
            exit 27
          fi
          echo "COMPILE_SCOPE=UNPRIVILEGED_QA_ONLY"
          echo "LIVE_MT5_TERMINAL_UNTOUCHED"
          echo "SOURCE_GIT_BLOB=$expected_source_blob"
          echo "HEADER_SHA256=$expected_include"
          if ! timeout 75s xvfb-run -a wineboot -u >"$qa/wineboot-qa.log" 2>&1; then
            echo QA_WINEBOOT_FAILED
            exit 28
          fi
          win_src="$(winepath -w "$qa/MQL5/Experts/ABUTRON/AbutronApexExistingDerivV4_6207.mq5")"
          win_include="$(winepath -w "$template")"
          cd "$qa"
          rc=0
          timeout --kill-after=5s 125s xvfb-run -a wine "$editor" \
            "/compile:$win_src" "/include:$win_include" /log >"$qa/compiler-stdout.log" 2>&1 || rc=$?
          log="$qa/MQL5/Experts/ABUTRON/AbutronApexExistingDerivV4_6207.log"
          ex5="$qa/MQL5/Experts/ABUTRON/AbutronApexExistingDerivV4_6207.ex5"
          echo "METAEDITOR_PROCESS_EXIT=$rc"
          if [[ -f "$log" ]]; then
            echo "COMPILE_LOG_PRESENT=true"
            # Compiler output is not trusted and may contain source literals.
            # Do not print it wholesale to GitHub job logs.
            echo "COMPILER_LOG_BYTES=$(stat -c %s "$log")"
            echo "COMPILER_ERRORS=$(grep -icE '(^|[[:space:]])error([[:space:]]|:)' "$log" || true)"
            echo "COMPILER_WARNINGS=$(grep -icE '(^|[[:space:]])warning([[:space:]]|:)' "$log" || true)"
          else
            echo "COMPILE_LOG_PRESENT=false"
          fi
          if [[ -f "$ex5" ]]; then
            echo "QA_EX5_SHA256=$(sha256sum "$ex5" | cut -d' ' -f1)"
            echo "QA_EX5_BYTES=$(stat -c %s "$ex5")"
            echo "QA_ONLY_NO_DEPLOYMENT"
          else
            echo "QA_EX5_NOT_GENERATED"
          fi
          timeout 10s wineserver -k >/dev/null 2>&1 || true
          # Build outputs are transient, not deployed. Preserve only sanitized
          # compiler status text in this job's logs.
          [[ "$rc" == 0 && -f "$ex5" && -s "$ex5" ]] || exit 29
          if [[ -f "$log" ]] && grep -iqE '(^|[[:space:]])[1-9][0-9]*[[:space:]]+errors?' "$log"; then
            echo "COMPILE_LOG_ERROR_COUNT_NONZERO"
            exit 30
          fi
          echo "ISOLATED_METAEDITOR_EX5_COMPILE_PASS_NOT_BROKER_CERTIFIED"
